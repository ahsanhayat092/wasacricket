    <path d="M 18 16 L 46 16 C 58 16 66 24 66 36 C 66 48 58 56 46 56 L 30 56 L 30 70 L 18 70 Z" 
          stroke="#009B4E" stroke-width="6.5" stroke-linejoin="miter" stroke-miterlimit="4" fill="none" />
    <g transform="rotate(-45 40 40)">
      <rect x="35" y="8" width="10" height="58" rx="1.5" fill="#009B4E" />
      <line x1="35" y1="24" x2="45" y2="24" stroke="#FFFFFF" stroke-width="2" />
      <line x1="35" y1="48" x2="45" y2="48" stroke="#FFFFFF" stroke-width="2" />
      <polygon points="40, -1 30, 11 50, 11" fill="#009B4E" />
