  </g>

  <!-- Typography: Approved PitchPe Dark Wordmark -->
  <text x="68" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="900" letter-spacing="-0.03em" fill="#111827">
