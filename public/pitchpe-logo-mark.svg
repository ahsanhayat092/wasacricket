<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- PitchPe Icon: Stylized 'P' with diagonal pitch & upward momentum arrow -->
  <!-- Main 'P' Loop & Stem -->
  <path d="M 22 20 L 58 20 C 74 20 84 30 84 46 C 84 62 74 72 58 72 L 38 72 L 38 90 L 22 90 Z" 
        stroke="#009B4E" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="4" fill="none" />
  
  <!-- Diagonal Cricket Pitch & Arrow (45° Angle) -->
  <g transform="rotate(-45 50 50)">
    <!-- Pitch Rectangle -->
    <rect x="44" y="10" width="12" height="74" rx="2" fill="#009B4E" />
    <!-- Crease Line 1 (Bowling Crease) -->
    <line x1="44" y1="30" x2="56" y2="30" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Crease Line 2 (Popping Crease) -->
    <line x1="44" y1="62" x2="56" y2="62" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Arrowhead at Top -->
    <polygon points="50, -2 38, 14 62, 14" fill="#009B4E" />
  </g>
</svg>